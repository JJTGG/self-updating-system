name: Scheduled update

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: self-updating-system
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch and update
        env:
          DATA_SOURCE_URL: ${{ secrets.DATA_SOURCE_URL }}
        run: python -m app.run_once
      - name: Run tests
        run: pytest -q
      - name: Commit updated data and changelog
        run: |
          git config user.name "self-updating-bot"
          git config user.email "actions@github.com"
          git add data CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: automated data update [skip ci]"
            git push
          fi
      - name: Open failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Automated update failed: ${new Date().toISOString()}`,
              body: `The scheduled update failed.\n\nRun: ${context.runId}\nPlease inspect logs and trigger the self-repair workflow.`,
              labels: ["bug", "automated-repair"]
            })
